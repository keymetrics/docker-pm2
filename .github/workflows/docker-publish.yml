name: Build and Publish Docker Images

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  schedule:
    # Weekly builds to catch Node.js and PM2 updates
    - cron: '0 2 * * 1'

env:
  IMAGE_NAME: keymetrics/pm2

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.versions.outputs.images }}
      pm2: ${{ steps.versions.outputs.pm2 }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Read versions
      id: versions
      run: |
        {
          echo "images=$(jq -c -f images.jq versions.json)"
          echo "pm2=$(npm view pm2 version)"
        } >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.tag }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.images) }}
    env:
      # dhi.io needs credentials even to pull, which fork pull requests do not get
      BUILDABLE: ${{ matrix.dockerfile != 'Dockerfile.hardened' || secrets.DOCKER_USERNAME != '' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Compute tags
      id: tags
      env:
        TAG: ${{ matrix.tag }}
        ALIASES: ${{ join(matrix.aliases, ' ') }}
      run: |
        {
          echo "list<<EOF"
          for t in $TAG $ALIASES; do echo "${IMAGE_NAME}:${t}"; done
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hardened Images
      if: matrix.dockerfile == 'Dockerfile.hardened' && env.BUILDABLE == 'true'
      uses: docker/login-action@v3
      with:
        registry: dhi.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build test image
      if: env.BUILDABLE == 'true'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64
        pull: true
        load: true
        tags: pm2-test:${{ matrix.tag }}
        build-args: |
          ${{ matrix.args }}
          PM2_VERSION=${{ needs.setup.outputs.pm2 }}
        cache-from: type=gha,scope=${{ matrix.tag }}
        cache-to: type=gha,scope=${{ matrix.tag }},mode=max

    - name: Test image
      if: env.BUILDABLE == 'true'
      run: bash test/test-image.sh pm2-test:${{ matrix.tag }} ${{ needs.setup.outputs.pm2 }}

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      if: env.BUILDABLE == 'true'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64,linux/arm64
        pull: true
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.tags.outputs.list }}
        build-args: |
          ${{ matrix.args }}
          PM2_VERSION=${{ needs.setup.outputs.pm2 }}
        labels: |
          org.opencontainers.image.version=${{ needs.setup.outputs.pm2 }}
          org.opencontainers.image.revision=${{ github.sha }}
        provenance: mode=max
        sbom: true
        cache-from: type=gha,scope=${{ matrix.tag }}
        cache-to: type=gha,scope=${{ matrix.tag }},mode=max

    - name: Scan for vulnerabilities
      if: github.event_name != 'pull_request' && env.BUILDABLE == 'true'
      continue-on-error: true
      uses: docker/scout-action@v1
      with:
        command: cves
        image: local://pm2-test:${{ matrix.tag }}
        only-severities: critical,high
        only-fixed: true
        exit-code: false

  ci:
    # Single required status check for branch protection, independent of the matrix
    name: ci
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Check build results
      run: '[ "${{ needs.build.result }}" = "success" ]'

  keepalive:
    # GitHub disables scheduled workflows after 60 days without repository activity
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Keep scheduled workflow enabled
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/docker-publish.yml/enable"
